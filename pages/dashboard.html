<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard Overview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .card {
            background: #e7f3fe;
            border-left: 5px solid #2196F3;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
        }
        .card-value {
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Dashboard Overview</h1>
        <div class="card">
            <div class="card-title">Balance</div>
            <div class="card-value">$10,000</div>
        </div>
        <div class="card">
            <div class="card-title">Income</div>
            <div class="card-value">$5,000</div>
        </div>
        <div class="card">
            <div class="card-title">Expenses</div>
            <div class="card-value">$3,000</div>
        </div>
    </div>
</body>
</html>
